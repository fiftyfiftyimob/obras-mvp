name: Web build and import tests
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-check.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Compile import module for isolated tests
        run: npx tsc --target ES2022 --module commonjs --moduleResolution node --lib ES2022,DOM --outDir .tmp-tests --rootDir . --skipLibCheck --esModuleInterop lib/collaborators-import.ts
        working-directory: web
      - run: node --test tests/collaborators-import.test.cjs
        working-directory: web
