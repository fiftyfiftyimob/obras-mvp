services:
  - type: web
    name: obras-whatsapp
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./whatsapp-bridge/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: SUPABASE_URL
        value: https://mulgoijgvmizboyxmxmg.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WHATSAPP_SESSION_PATH
        value: /tmp/wwebjs_auth
      - key: OUTBOX_INTERVAL_MS
        value: "5000"
      - key: CONTROL_INTERVAL_MS
        value: "4000"
